services:
  # Named volumes keep the one-time download and the output between runs.
  # To use checkpoints you already have, comment the named volume below and uncomment the bind mount.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pulse-quantization:cpu
    working_dir: /app
    volumes:
      - pulse-checkpoints:/app/checkpoints
      # - ../checkpoints:/app/checkpoints:ro
      - ../datasets:/app/datasets:ro
    command: python -m unittest discover -s quantization-pluse-mse/tests

  # Reproduce the headline number: 21.677 MB at 0.672% on Kodak.
  verify:
    image: pulse-quantization:cpu
    working_dir: /app
    volumes:
      - pulse-checkpoints:/app/checkpoints
      - ../datasets:/app/datasets:ro
      - pulse-results:/app/results
    command: >
      python quantization-pluse-mse/scripts/eval_assignment.py
      --model checkpoints/pulse-mse
      --configs quantization-pluse-mse/results/ilp/assignment_ilp.json
      --dataset kodak
      --output results/check

  # Solve a different quality budget. Seconds, no GPU, no checkpoint needed.
  solve:
    image: pulse-quantization:cpu
    working_dir: /app
    command: >
      python quantization-pluse-mse/scripts/solve_ilp.py --budget 1.0 1.8 --headline 1.0

volumes:
  pulse-checkpoints:
  pulse-results:
